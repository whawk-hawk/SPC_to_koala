<style>
  :root{
    /* スーパーファミコン本体の配色 */
    --body:#c9c9d3;         /* 本体グレー */
    --panel:#dcdce3;        /* 明るいパネル */
    --panel-deep:#b3b3bf;   /* 沈んだグレー */
    --slot:#8e8e9c;         /* カセット挿入口 */
    --ink:#3a3a46;          /* 濃スレート文字 */
    --ink-soft:#6d6d7c;
    --sfc-red:#e6402a; --sfc-yellow:#f0a800; --sfc-green:#159a54; --sfc-blue:#1c6bb8;
    --wave:#2f2f3a;
    --radius:10px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--body); color:var(--ink);
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;}
  .wrap{max-width:760px; margin:0 auto; padding:20px 14px 80px;}

  /* ── ヘッダ: チップのシルク印刷風 ── */
  header{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;
    border-bottom:3px solid var(--ink); padding-bottom:10px; margin-bottom:18px;}
  header h1{font-size:clamp(22px,5vw,30px); font-weight:800; letter-spacing:.04em;}
  header h1 .arrow{color:var(--sfc-red);}
  header .chiplabel{font-size:11px; letter-spacing:.22em; color:var(--ink-soft);
    text-transform:uppercase;}
  .btn-dots{display:inline-flex; gap:5px; margin-left:auto; align-self:center;}
  .btn-dots i{width:11px;height:11px;border-radius:50%;display:block;}
  .btn-dots i:nth-child(1){background:var(--sfc-red);}   .btn-dots i:nth-child(2){background:var(--sfc-yellow);}
  .btn-dots i:nth-child(3){background:var(--sfc-green);} .btn-dots i:nth-child(4){background:var(--sfc-blue);}

  /* ── ドロップゾーン: カセット挿入口 ── */
  #drop{position:relative; border-radius:var(--radius); background:var(--panel-deep);
    padding:26px 16px 22px; text-align:center; cursor:pointer;
    border:2px dashed transparent; transition:border-color .15s ease, background .15s ease;}
  #drop .slot{width:min(340px,80%); height:16px; margin:0 auto 14px; border-radius:4px;
    background:linear-gradient(var(--slot), #7c7c8a); box-shadow:inset 0 3px 6px rgba(0,0,0,.35);}
  #drop p{font-size:14px; font-weight:600;}
  #drop small{display:block; margin-top:6px; color:var(--ink-soft); font-size:12px;}
  #drop.over{border-color:var(--sfc-green); background:#c2cfc6;}
  #drop input{display:none;}

  /* ── 情報ストリップ ── */
  #fileinfo{display:none; margin-top:16px; background:var(--panel); border-radius:var(--radius);
    padding:12px 14px; font-size:12.5px; line-height:1.8;}
  #fileinfo .row{display:flex; gap:10px; flex-wrap:wrap;}
  #fileinfo .k{color:var(--ink-soft); letter-spacing:.08em; min-width:7em;}

  /* ── オプション ── */
  #opts{display:none; margin-top:14px; gap:10px; flex-wrap:wrap; align-items:center;}
  #opts.on{display:flex;}
  .seg{display:inline-flex; border:2px solid var(--ink); border-radius:8px; overflow:hidden;}
  .seg button{border:0; background:var(--panel); color:var(--ink); padding:7px 14px;
    font-size:12.5px; font-weight:700; cursor:pointer;}
  .seg button.on{background:var(--ink); color:var(--panel);}
  label.chk{display:inline-flex; align-items:center; gap:7px; font-size:12.5px; font-weight:600; cursor:pointer;}
  label.chk input{accent-color:var(--sfc-green); width:16px; height:16px;}

  /* ── パッドグリッド(署名要素) ── */
  #padsec{display:none; margin-top:22px;}
  #padsec h2, #listsec h2{font-size:12px; letter-spacing:.22em; color:var(--ink-soft);
    margin-bottom:10px; text-transform:uppercase;}
  #padgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
  .pad{position:relative; aspect-ratio:1; border-radius:12px; background:var(--panel);
    border:2px solid rgba(0,0,0,.14); cursor:pointer; overflow:hidden;
    display:flex; flex-direction:column; box-shadow:0 2px 0 rgba(0,0,0,.18);}
  .pad:active{transform:translateY(1px); box-shadow:0 1px 0 rgba(0,0,0,.18);}
  .pad.playing{outline:3px solid var(--ink);}
  .pad canvas{flex:1; width:100%; display:block;}
  .pad .tag{font-size:9.5px; font-weight:800; letter-spacing:.05em; text-align:center;
    padding:3px 2px 4px; color:#fff;}
  .pad.empty{background:var(--panel-deep); border-style:dashed; cursor:default; box-shadow:none;}
  .pad.empty .tag{color:var(--ink-soft); background:none !important;}

  /* ── サンプル一覧 ── */
  #listsec{display:none; margin-top:24px;}
  #cap{font-size:12px; color:var(--ink-soft); margin-bottom:8px;}
  #cap b{color:var(--ink);}
  .srow{display:flex; align-items:center; gap:10px; background:var(--panel);
    border-radius:8px; padding:7px 10px; margin-bottom:6px; font-size:12.5px;}
  .srow input{accent-color:var(--sfc-blue); width:16px; height:16px; flex:none;}
  .srow canvas{width:90px; height:26px; flex:none; background:#eceef0; border-radius:4px;}
  .srow .nm{font-weight:700; min-width:4.5em;}
  .srow .meta{color:var(--ink-soft);}
  .srow button{margin-left:auto; flex:none; border:2px solid var(--ink); background:var(--panel);
    border-radius:6px; width:30px; height:26px; cursor:pointer; font-size:12px; line-height:1;}
  .srow.dup{opacity:.45;}
  .lp{font-size:9.5px; font-weight:800; color:#fff; border-radius:4px; padding:2px 5px;}
  .lp.loop{background:var(--sfc-blue);} .lp.shot{background:var(--sfc-green);}

  /* ── ダウンロード ── */
  #dlsec{display:none; margin-top:26px; gap:10px; flex-wrap:wrap;}
  #dlsec.on{display:flex;}
  .big{border:0; border-radius:10px; padding:14px 22px; font-size:15px; font-weight:800;
    letter-spacing:.03em; cursor:pointer; color:#fff; box-shadow:0 3px 0 rgba(0,0,0,.25);}
  .big:active{transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.25);}
  #dlkoala{background:var(--sfc-red); flex:1; min-width:220px;}
  #dlwav{background:var(--slot);}
  #note{display:none; margin-top:14px; font-size:11.5px; color:var(--ink-soft); line-height:1.7;}
  #err{display:none; margin-top:14px; background:#f3d7d2; border:2px solid var(--sfc-red);
    border-radius:8px; padding:10px 12px; font-size:13px;}
  @media (prefers-reduced-motion:reduce){ *{transition:none !important;} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>SPC <span class="arrow">→</span> KOALA</h1>
    <span class="chiplabel mono">S-SMP · BRR Sample Extractor</span>
    <span class="btn-dots" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
  </header>

  <div id="drop">
    <div class="slot" aria-hidden="true"></div>
    <p>SPCファイルをここにドロップ</p>
    <small>またはタップして選択(.spc / 約66KB)</small>
    <input type="file" id="fpick" accept=".spc">
  </div>

  <div id="err"></div>

  <div id="fileinfo" class="mono"></div>
  <div id="status" class="mono" style="display:none;margin-top:8px;font-size:12px;color:var(--ink-soft);"></div>

  <div id="opts">
    <div class="seg" id="rateseg">
      <button data-r="16000">16 kHz</button>
      <button data-r="32000" class="on">32 kHz</button>
    </div>
    <label class="chk"><input type="checkbox" id="looppad" checked>ループ音色をループパッド化</label>
    <label class="chk"><input type="checkbox" id="useenv" checked>ADSRエンベロープ適用(DSP実測 / 無ければ典型値)</label>
    <label class="chk">解析秒数<input type="number" id="capsec" value="120" min="10" max="300" step="10" style="width:4.5em;margin-left:5px;"></label>
  </div>

  <section id="padsec">

<script>
"use strict";
/* ===================== SPC 解析 ===================== */
const MAGIC = "SNES-SPC700 Sound File Data";

function parseSPC(buf){
  const u8 = new Uint8Array(buf);
  if(u8.length < 0x10180) throw new Error("ファイルが小さすぎます(SPCは最低66,048バイト)");
  const magic = new TextDecoder("ascii").decode(u8.slice(0,27));
  if(magic !== MAGIC) throw new Error("SPCヘッダが見つかりません(" + magic.slice(0,16) + "...)");
  const ram = u8.slice(0x100, 0x10100);
  const dsp = u8.slice(0x10100, 0x10180);
  // ID666(バイナリ/テキストの揺れがあるため、表示用に緩く読む)
  const id666 = {};
  if(u8[0x23] === 26){
    const sj = (off,len)=>{ const raw = u8.slice(off,off+len); let e = raw.indexOf(0); if(e<0) e=len;
      try{ return new TextDecoder("shift_jis").decode(raw.slice(0,e)).trim(); }
      catch(_){ return new TextDecoder("ascii").decode(raw.slice(0,e)).trim(); } };
    id666.song = sj(0x2E,32); id666.game = sj(0x4E,32); id666.artist = sj(0xB1,32);
  }
  // DSPレジスタから8ボイス分の SRCN / ADSR1 / ADSR2 / GAIN を抽出
  const voices = [];
  for(let v=0; v<8; v++){
    voices.push({
      voice: v,
      srcn:  dsp[v*16 + 4],
      adsr1: dsp[v*16 + 5],
      adsr2: dsp[v*16 + 6],
      gain:  dsp[v*16 + 7],
    });
  }
  return { u8, ram, dsp, id666, dir: dsp[0x5D] << 8, voices };
}

/* ===================== ADSR エンベロープ ===================== */
/* 各テーブルは Super MIDI Pak doc (supermidipak.com/doc) のハード実測値に準拠 */
/* S-DSP アタックレート(AR 0..15)→ 0→フルまでの秒数 */
const AR_TIME = [4.1,2.5,1.5,1.0,0.64,0.38,0.26,0.16,0.096,0.064,0.040,0.024,0.016,0.010,0.006,0];
/* S-DSP ディケイレート(DR 0..7)→ フル→サスティンレベルまでの秒数 */
const DR_TIME = [1.2,0.74,0.44,0.29,0.18,0.11,0.074,0.037];
/* S-DSP サスティンレート(SR 0..31)→ 減衰時間の秒数(0は減衰なし=∞) */
const SR_TIME = [Infinity,38,28,24,19,14,12,9.4,7.1,5.9,4.7,3.5,2.9,2.4,1.8,1.5,
                 1.2,0.88,0.74,0.59,0.44,0.37,0.29,0.22,0.18,0.15,0.11,0.092,0.074,0.055,0.037,0.018];
/* Koalaノブ(0..1)への変換上限。実測に合わせて調整可能 */
const KOALA_ATT_MAX = 4.1;   // attackノブ最大 ≒ この秒数とみなす
const KOALA_REL_MAX = 4.0;   // releaseノブ最大 ≒ この秒数とみなす
const KOALA_ATT_MIN = 0.00011; // Koalaのattack最小デフォルト値

function toKoalaAttack(sec){
  if(!(sec > 0.006)) return KOALA_ATT_MIN;
  return Math.min(1, Math.sqrt(sec / KOALA_ATT_MAX));
}
function toKoalaRelease(sec){
  if(!isFinite(sec) || sec <= 0) return 0;   // SR=0(減衰なし)はキーオフで即カット扱い
  return Math.min(1, Math.sqrt(Math.min(sec, KOALA_REL_MAX) / KOALA_REL_MAX));
}
/* SRCN→エンベロープのマップを作る(ADSR有効なボイスを優先) */
function buildEnvMap(voices){
  const map = new Map();
  for(const v of voices){
    if(!(v.adsr1 & 0x80)) continue;          // GAINモードはスキップ(典型値へフォールバック)
    if(map.has(v.srcn)) continue;            // 同一SRCNは最初のADSR有効ボイスを採用
    const ar = v.adsr1 & 0x0F;
    const dr = (v.adsr1 >> 4) & 0x07;
    const sr = v.adsr2 & 0x1F;
    const sl = (v.adsr2 >> 5) & 0x07;
    const slFrac = (sl + 1) / 8;
    const drSec = DR_TIME[dr], srSec = SR_TIME[sr];
    let relSec;
    if(!isFinite(srSec)){
      relSec = (1 - slFrac) * drSec;
    } else {
      relSec = slFrac * srSec + (1 - slFrac) * drSec;
    }
    map.set(v.srcn, {
      fromDSP: true, voice: v.voice, ar, dr, sr, sl,
      attackSec: AR_TIME[ar], decaySec: drSec, sustainSec: srSec, releaseSec: relSec,
      attack: toKoalaAttack(AR_TIME[ar]),
      release: toKoalaRelease(relSec),
    });
  }
  return map;
}
/* DSPに情報がないサンプルへの典型値 */
function typicalEnv(loopFlag){
  return loopFlag
    ? {fromDSP:false, attack:KOALA_ATT_MIN, release:0.35}
    : {fromDSP:false, attack:KOALA_ATT_MIN, release:0};
}

/* ディレクトリ走査: 妥当なBRRサンプルを列挙 */
function scanSamples(ram, dirAddr){
  const out = [];
  for(let i=0;i<256;i++){
    const off = dirAddr + i*4;
    if(off+4 > 0x10000) break;
    const start = ram[off] | (ram[off+1]<<8);
    const loopP = ram[off+2] | (ram[off+3]<<8);
    if(start === 0 || start === 0xFFFF) continue;
    let p = start, blocks = 0, end = -1, loopFlag = false;
    while(p+9 <= 0x10000 && blocks < 7282){
      const hdr = ram[p]; blocks++;
      if(hdr & 1){ end = p+9; loopFlag = !!(hdr & 2); break; }
      p += 9;
    }
    if(end < 0) continue;
    out.push({idx:i, start, end, loopP, loopFlag, bytes:end-start, frames:blocks*16});
  }
  return out;
}

/* 内容ハッシュ(FNV-1a)で重複検出 */
function contentHash(ram, s){
  let h = 0x811c9dc5;
  for(let i=s.start;i<s.end;i++){ h ^= ram[i]; h = Math.imul(h, 0x01000193); }
  return (h>>>0).toString(16) + ":" + s.bytes;
}

/* ===================== BRR デコード ===================== */
function clamp16(v){ return v>32767?32767 : v<-32768?-32768 : v; }
function decodeBRR(ram, start, end){
  const n = ((end-start)/9|0)*16;
  const out = new Int16Array(n);
  let p1=0, p2=0, o=0;
  for(let i=start; i+9<=end; i+=9){
    const hdr = ram[i], shift = hdr>>4, filt = (hdr>>2)&3;
    for(let j=0;j<16;j++){
      const b = ram[i+1+(j>>1)];
      let nib = (j&1) ? (b&0xF) : (b>>4);
      if(nib >= 8) nib -= 16;
      let s = (shift<=12) ? (nib<<shift)>>1 : (nib>=0?2048:-2048);
      if(filt===1)      s += p1 + (-p1>>4);
      else if(filt===2) s += (p1<<1) + (-((p1<<1)+p1)>>5) - p2 + (p2>>4);
      else if(filt===3) s += (p1<<1) + (-(p1+(p1<<2)+(p1<<3))>>6) - p2 + (((p2<<1)+p2)>>4);
      s = clamp16(s); p2 = p1; p1 = s; out[o++] = s;
    }
  }
  return out;
}

/* ===================== DSPソロ再生エンジン(WASM/libgme) ===================== */
/* README記載のDSPレジスタ書き込みフック改造込みのlibgme(SPC専用)をWebAssembly化したもの。
   spc_load / spc_mute / spc_play / spc_log_* をJSから呼べる。 */
const CLOCK_RATE = 1024000.0;      // SPCクロック(Hz)。extract_notes.py と同じ定義
const JUNK_FRAME_THRESHOLD = 100;  // これ未満のフレーム数のサンプルはダミー領域として除外

let ENGINE_MOD = null;
async function getEngine(){
  if(!ENGINE_MOD) ENGINE_MOD = await SpcEngineModule();
  return ENGINE_MOD;
}
function engineReload(M, u8, rate){
  const ptr = M._malloc(u8.length);
  M.HEAPU8.set(u8, ptr);
  const rc = M.ccall("spc_load","number",["number","number","number"],[ptr,u8.length,rate]);
  M._free(ptr);
  if(rc !== 0) throw new Error("SPCエンジンへのロードに失敗しました(rc=" + rc + ")");
}
function engineMute(M, mask){ M.ccall("spc_mute","null",["number"],[mask]); }
/* count: モノラルではなくステレオフレーム数。戻り値は Int16Array(長さ count*2, L/R交互) */
function enginePlay(M, count){
  const bytes = count*2*2; // stereo, 2 bytes/sample
  const ptr = M._malloc(bytes);
  const rc = M.ccall("spc_play","number",["number","number"],[ptr,count]);
  if(rc !== 0){ M._free(ptr); throw new Error("再生に失敗しました(rc=" + rc + ")"); }
  const out = new Int16Array(M.HEAP16.buffer, ptr, count*2).slice(); // slice()でコピーを取り出す
  M._free(ptr);
  return out;
}
/* 全ボイス・ミュート無しで再生しつつ、DSPレジスタ書き込みログを丸ごと取得する(render_spc_log相当) */
function captureDspLog(M, u8, rate, seconds){
  engineReload(M, u8, rate);
  engineMute(M, 0);
  const nFrames = Math.round(seconds*rate);
  enginePlay(M, nFrames); // 出力自体は使わずログだけ利用
  const cnt = M.ccall("spc_log_count","number",[],[]);
  if(cnt <= 0) return new Int32Array(0);
  const ptr = M.ccall("spc_log_ptr","number",[],[]);
  return new Int32Array(M.HEAP32.buffer, ptr, cnt*3).slice();
}
/* 指定ボイスだけソロ再生し、[startSec,endSec)をモノラルに落として切り出す(render_spc_solo相当) */
function soloRenderSlice(M, u8, rate, voice, startSec, endSec){
  engineReload(M, u8, rate);
  engineMute(M, 0xFF & ~(1<<voice));
  const endFrame = Math.max(1, Math.round(endSec*rate));
  const stereo = enginePlay(M, endFrame);
  const startFrame = Math.max(0, Math.round(startSec*rate));
  const n = Math.max(1, endFrame - startFrame);
  const out = new Int16Array(n);
  for(let i=0;i<n;i++){
    const si = startFrame + i;
    const l = stereo[si*2] || 0, r = stereo[si*2+1] || 0;
    out[i] = (l+r) >> 1;
  }
  return out;
}
/* ミュート無しで曲全体(数十秒)をまるごとモノラルに落として書き出す */
function fullMixRender(M, u8, rate, seconds){
  engineReload(M, u8, rate);
  engineMute(M, 0);
  const nFrames = Math.max(1, Math.round(seconds*rate));
  const stereo = enginePlay(M, nFrames);
  const out = new Int16Array(nFrames);
  for(let i=0;i<nFrames;i++){
    out[i] = (stereo[i*2] + stereo[i*2+1]) >> 1;
  }
  return out;
}
/* ミュート無しで[startSec,endSec)だけを切り出す版(頭のイントロ区間を捨てて、ループ本体から書き出すため) */
function fullMixRenderSlice(M, u8, rate, startSec, endSec){
  engineReload(M, u8, rate);
  engineMute(M, 0);
  const endFrame = Math.max(1, Math.round(endSec*rate));
  const stereo = enginePlay(M, endFrame);
  const startFrame = Math.max(0, Math.round(startSec*rate));
  const n = Math.max(1, endFrame - startFrame);
  const out = new Int16Array(n);
  for(let i=0;i<n;i++){
    const si = startFrame + i;
    const l = stereo[si*2] || 0, r = stereo[si*2+1] || 0;
    out[i] = (l+r) >> 1;
  }
  return out;
}

/* ===================== ノート抽出(extract_notes.py 移植) ===================== */
/* flat: Int32Array の [time,addr,data, time,addr,data, ...] 三つ組フラット配列 */
function extractNotesJS(flat){
  const pitchLo = new Array(8).fill(0), pitchHi = new Array(8).fill(0);
  const srcn = new Array(8).fill(0), volL = new Array(8).fill(0), volR = new Array(8).fill(0);
  const active = new Array(8).fill(null);
  const notes = [];
  const toSigned8 = v => v >= 128 ? v-256 : v;
  const curPitch14 = vi => pitchLo[vi] | (pitchHi[vi] << 8);
  const closeNote = (vi, endT) => {
    const an = active[vi];
    notes.push({voice:vi, start:an.start, end:endT, pitch14:an.pitch14, srcn:an.srcn,
                voll:an.voll, volr:an.volr, pitchTrack:an.pitchTrack});
    active[vi] = null;
  };
  const n = flat.length/3|0;
  let lastT = 0;
  for(let k=0;k<n;k++){
    const t = flat[k*3], addr = flat[k*3+1], data = flat[k*3+2];
    lastT = t;
    const v = addr >> 4, low = addr & 0x0F;
    if(addr === 0x4C){ // KON
      for(let vi=0; vi<8; vi++){
        if(data & (1<<vi)){
          if(active[vi] !== null) closeNote(vi, t);
          const p14 = curPitch14(vi);
          active[vi] = {start:t, pitch14:p14, srcn:srcn[vi], voll:volL[vi], volr:volR[vi], pitchTrack:[[t,p14]]};
        }
      }
    } else if(addr === 0x5C){ // KOFF
      for(let vi=0; vi<8; vi++){
        if(data & (1<<vi)){
          if(active[vi] !== null) closeNote(vi, t);
        }
      }
    } else if(v >= 0 && v < 8){
      if(low === 0x00) volL[v] = toSigned8(data);
      else if(low === 0x01) volR[v] = toSigned8(data);
      else if(low === 0x02){ pitchLo[v] = data; if(active[v]) active[v].pitchTrack.push([t, curPitch14(v)]); }
      else if(low === 0x03){ pitchHi[v] = data; if(active[v]) active[v].pitchTrack.push([t, curPitch14(v)]); }
      else if(low === 0x04) srcn[v] = data;
    }
  }
  for(let vi=0; vi<8; vi++){ if(active[vi] !== null) closeNote(vi, lastT); }
  notes.sort((a,b)=>a.start-b.start);
  return notes;
}

/* ===================== ループ長自動検出(detect_loop.py 移植) ===================== */
function onsetVector(notes, binSec, totalSec){
  const nBins = Math.floor(totalSec/binSec) + 1;
  const v = new Float64Array(nBins);
  for(const n of notes){
    const t = n.start / CLOCK_RATE;
    if(t < totalSec){ v[Math.floor(t/binSec)] += 1.0; }
  }
  return v;
}
function findLoopJS(v, binSec, minLoopSec=3.0, maxLoopSec=60.0){
  const n = v.length;
  const mean = v.reduce((a,b)=>a+b,0)/n;
  const vv = new Float64Array(n);
  for(let i=0;i<n;i++) vv[i] = v[i]-mean;
  const minLag = Math.round(minLoopSec/binSec);
  const maxLag = Math.min(Math.round(maxLoopSec/binSec), Math.floor(n/2));
  let bestLag = null, bestScore = -1;
  for(let lag=minLag; lag<maxLag; lag++){
    let num=0, aa=0, bb=0;
    const len = n-lag;
    for(let i=0;i<len;i++){
      const a = vv[i], b = vv[i+lag];
      num += a*b; aa += a*a; bb += b*b;
    }
    const denom = Math.sqrt(aa*bb);
    if(denom === 0) continue;
    const score = num/denom;
    if(score > bestScore){ bestScore = score; bestLag = lag; }
  }
  if(bestLag === null) return null;
  return {sec: bestLag*binSec, score: bestScore};
}

/* ループ「長さ」Lが決まった後、ループが本当に始まる位置(=イントロの長さ)Sを探す。
   S以降をLごとに区切って隣り合う窓同士を全部比較し、一番よく一致するSを採用する。 */
function findLoopStartJS(v, binSec, loopSec, maxIntroSec=30.0){
  const L = Math.max(1, Math.round(loopSec/binSec));
  const n = v.length;
  const maxIntroBins = Math.max(0, Math.min(Math.round(maxIntroSec/binSec), n - 2*L));
  let bestS = 0, bestScore = -1;
  for(let S=0; S<=maxIntroBins; S++){
    const reps = Math.floor((n - S) / L);
    if(reps < 2) break;
    let num=0, aa=0, bb=0;
    for(let r=0; r<reps-1; r++){
      const base = S + r*L;
      for(let i=0;i<L;i++){
        const a = v[base + i], b = v[base + L + i];
        num += a*b; aa += a*a; bb += b*b;
      }
    }
    const denom = Math.sqrt(aa*bb);
    if(denom === 0) continue;
    const score = num/denom;
    if(score > bestScore){ bestScore = score; bestS = S; }
  }
  return {startBin: bestS, score: bestScore};
}
/* 粗いビン単位で見つけたループ開始位置を、実際に一番近いノート発音タイミングにスナップする。
   ノートの途中でループ頭を切ってプチノイズになるのを防ぐため。 */
function snapToNearestNoteTime(notes, targetSec, windowSec){
  let best = targetSec, bestDist = Infinity;
  for(const n of notes){
    const t = n.start / CLOCK_RATE;
    const d = Math.abs(t - targetSec);
    if(d < bestDist && d <= windowSec){ bestDist = d; best = t; }
  }
  return best;
}

/* ===================== WAV エンコード ===================== */
function encodeWAV(pcm, rate){
  const buf = new ArrayBuffer(44 + pcm.length*2);
  const v = new DataView(buf);
  const ws = (o,s)=>{ for(let i=0;i<s.length;i++) v.setUint8(o+i, s.charCodeAt(i)); };
  ws(0,"RIFF"); v.setUint32(4, 36+pcm.length*2, true); ws(8,"WAVE");
  ws(12,"fmt "); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,rate,true); v.setUint32(28,rate*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
  ws(36,"data"); v.setUint32(40, pcm.length*2, true);
  new Int16Array(buf,44).set(pcm);
  return buf;
}

/* ===================== .koala テンプレート ===================== */
const PAD_TPL = {attack:0.00011,bus:-1,channel:0,chokeGroup:0,cyclicPeriod:20,end:0,
  eq:{enabled:"false",hi:{freq:8000.0,gain:0.0,q:1.0,type:"highshelf"},
      lo:{freq:100.0,gain:0.0,q:1.0,type:"lowshelf"},

  hasLoopPoint:"false",label:"",loopPoint:-1,looping:"false",muted:false,oneshot:"true",

function buildSequenceJSON(){
  const seqs = Array.from({length:32},()=>({pattern:{notes:null,numBars:1}}));
  return {autoPlay:"off",beatsPerBar:4,bpm:120.0,currSequenceId:0,
    quantizeDivision:16,seqSnap:3,sequences:seqs,swing:0.0};
}

/* ===================== 状態 ===================== */
let SPC = null;          // parseSPC結果
let SAMPLES = [];        // ユニークサンプル(100フレーム以上・pad割当候補)
let DUPES = [];          // 重複(表示用)
let JUNK = [];           // 100フレーム未満のダミー領域として除外されたもの(表示用)
let SELECTED = new Set();// 選択中 idx (文字列/数値どちらもキーとして使う)
let RATE = 32000;
let baseName = "spc_project";
const MAXPADS = 64;      // 16パッド × 4バンク(A〜D)
const BANKSIZE = 16;
let BANK = 0;            // 表示中バンク 0..3
let ENVMAP = new Map();  // SRCN → DSP実測エンベロープ
let audioCtx = null;
let LOOP_INFO = null;    // {sec, score} 検出されたループ長
let RAW_BYTES = null;    // 元SPCファイルのバイト列(エンジン再ロード用)

function padLabel(s){
  if(s.idx === "FULL") return `${baseName}_FULL`;
  const tag = s.dspCaptured ? "note" : (s.loopFlag?"loop":"shot");
  return `S${String(s.idx).padStart(2,"0")}_${tag}`;
}
function sampleFileName(s){
  if(s.idx === "FULL") return `spc_fullmix.wav`;
  return `spc_sample_${String(s.idx).padStart(2,"0")}${s.dspCaptured?"_note":""}.wav`;
}

/* ===================== UI ===================== */
const $ = id => document.getElementById(id);
function setStatus(msg){
  if(msg){ $("status").style.display = "block"; $("status").textContent = msg; }
  else { $("status").style.display = "none"; $("status").textContent = ""; }
}

async function loadFile(file){
  $("err").style.display = "none";
  try{
    const buf = await file.arrayBuffer();
    SPC = parseSPC(buf);
    RAW_BYTES = new Uint8Array(buf);
    baseName = file.name.replace(/\.[^.]+$/,"");
    const all = scanSamples(SPC.ram, SPC.dir);
    if(!all.length) throw new Error("有効なBRRサンプルが見つかりませんでした(DIR=0x"+SPC.dir.toString(16).toUpperCase()+")");

    // 重複除去
    const seen = new Map(); let uniq = []; DUPES = [];
    for(const s of all){
      const h = contentHash(SPC.ram, s);
      if(seen.has(h)){ s.dupOf = seen.get(h); DUPES.push(s); }
      else{ seen.set(h, s.idx); s.pcm = decodeBRR(SPC.ram, s.start, s.end); uniq.push(s); }
    }

    // 極端に短い(100フレーム未満)ダミー領域を除外
    SAMPLES = uniq.filter(s => s.frames >= JUNK_FRAME_THRESHOLD);
    JUNK = uniq.filter(s => s.frames < JUNK_FRAME_THRESHOLD);

    // DSPボイスからのエンベロープ情報を各サンプルへ付与
    ENVMAP = buildEnvMap(SPC.voices);
    for(const s of SAMPLES){ s.env = ENVMAP.get(s.idx) || typicalEnv(s.loopFlag); }

    // 表示を先に確定させてから重い処理へ(canvasのclientWidthを正しく取るため)
    BANK = 0; syncBankTabs();
    $("opts").classList.add("on"); $("padsec").style.display = "block";
    $("listsec").style.display = "block"; $("dlsec").classList.add("on");
    $("note").style.display = "block";
    LOOP_INFO = null;
    renderInfo(); renderList(); renderPads();

    // ここから: DSPソロ再生で「本物の再生音」を各pad用サンプルに反映する処理
    await runDspCapture();

  }catch(e){
    $("err").textContent = "読み込みエラー: " + e.message;
    $("err").style.display = "block";
    setStatus(null);
  }
}

async function runDspCapture(){
  const capSec = Math.max(10, Math.min(300, +$("capsec").value || 120));
  try{
    setStatus("エンジン初期化中…");
    const M = await getEngine();

    setStatus(`DSPレジスタログ取得中…(${capSec}秒ぶん再生)`);
    const flat = captureDspLog(M, RAW_BYTES, RATE, capSec);
    const notes = extractNotesJS(flat);

    setStatus("ループ長を自己相関で検出中…");
    const binSec = 0.02;
    const v = onsetVector(notes, binSec, capSec);
    const found = notes.length ? findLoopJS(v, binSec) : null;
    if(found){
      const startResult = findLoopStartJS(v, binSec, found.sec);
      let introSec = startResult.startBin * binSec;
      introSec = snapToNearestNoteTime(notes, introSec, binSec*1.5);
      LOOP_INFO = {sec: found.sec, score: found.score, introSec, startScore: startResult.score};
    } else {
      LOOP_INFO = {sec: capSec, score: 0, introSec: 0, startScore: 0};
    }

    // 重複マップ(dup idx -> canonical idx)
    const dupeMap = new Map(DUPES.map(d=>[d.idx, d.dupOf]));
    const canonOf = srcn => dupeMap.has(srcn) ? dupeMap.get(srcn) : srcn;

    // SRCNごとに最初に検出されたノートを集める
    const firstNoteBySrcn = new Map();
    for(const n of notes){
      const canon = canonOf(n.srcn);
      if(!firstNoteBySrcn.has(canon)) firstNoteBySrcn.set(canon, n);
    }

    // 各サンプルを「そのボイスをソロ再生した本物の音」に差し替える
    let done = 0;
    for(const s of SAMPLES){
      const n = firstNoteBySrcn.get(s.idx);
      if(n){
        setStatus(`個々のサンプルを実波形で再取得中… (${++done}/${SAMPLES.length})`);
        const startSec = n.start / CLOCK_RATE;
        const tailSec = 0.05;
        const endSec = Math.min(capSec, n.end / CLOCK_RATE + tailSec);
        try{
          const pcm = soloRenderSlice(M, RAW_BYTES, RATE, n.voice, startSec, endSec);
          if(pcm.length > 0){
            s.pcm = pcm; s.frames = pcm.length;
            s.dspCaptured = true; s.forceOneshot = true; s.loopFlag = false;
          }
        }catch(err){ /* このサンプルだけ失敗した場合はBRR直接デコードのまま(フォールバック) */ }
      } else {
        done++;
      }
    }

    // 曲全体(イントロを飛ばし、ループ本体の開始点からループ長ぶん)を1本のpad用サンプルとして書き出す
    setStatus(`曲全体(イントロ${LOOP_INFO.introSec.toFixed(2)}秒を省略し、ループ本体${LOOP_INFO.sec.toFixed(2)}秒)をレンダリング中…`);
    const fullPcm = fullMixRenderSlice(M, RAW_BYTES, RATE, LOOP_INFO.introSec, LOOP_INFO.introSec + LOOP_INFO.sec + 0.2);
    const fullSample = {idx:"FULL", loopFlag:false, forceOneshot:true, isFullMix:true,
                         frames:fullPcm.length, pcm:fullPcm, bytes:0};
    fullSample.env = typicalEnv(false);
    SAMPLES.push(fullSample);

    // 自動選択をやり直す: ワンショット(サイズ降順) → ループ(サイズ降順)、フルミックスは必ず確保
    SELECTED = new Set();
    SELECTED.add("FULL");
    const rest = SAMPLES.filter(s=>s.idx!=="FULL");
    const shots = rest.filter(s=>!s.loopFlag).sort((a,b)=>b.bytes-a.bytes);
    const loops = rest.filter(s=> s.loopFlag).sort((a,b)=>b.bytes-a.bytes);
    for(const s of [...shots, ...loops]){ if(SELECTED.size < MAXPADS) SELECTED.add(s.idx); }

    setStatus(null);
    renderInfo(); renderList(); renderPads();
  }catch(e){
    // WASMエンジンが使えない環境などの場合は、従来のBRR直接デコードのみで動作を継続する
    setStatus(null);
    console.warn("DSPソロ再生に失敗したため、BRR直接デコードのみで続行します:", e);
    $("err").textContent = "本物の再生音の取得に失敗しました(BRR直接デコードのみで続行します): " + e.message;
    $("err").style.display = "block";
  }
}

function renderInfo(){
  const t = SPC.id666;
  const tag = (t.song||t.game||t.artist)
    ? `<div class="row"><span class="k">ID666</span><span>${[t.song,t.game,t.artist].filter(Boolean).join(" / ")}</span></div>`
    : `<div class="row"><span class="k">ID666</span><span>タグなし</span></div>`;
  const loopRow = LOOP_INFO
    ? `<div class="row"><span class="k">LOOP</span><span>イントロ ${(LOOP_INFO.introSec||0).toFixed(3)}秒 + ループ本体 ${LOOP_INFO.sec.toFixed(3)}秒(長さスコア ${LOOP_INFO.score.toFixed(3)} / 開始点スコア ${(LOOP_INFO.startScore||0).toFixed(3)})</span></div>`
    : "";
  $("fileinfo").innerHTML =
    `<div class="row"><span class="k">FILE</span><span>${baseName}.spc</span></div>` + tag +
    `<div class="row"><span class="k">DIR</span><span>0x${SPC.dir.toString(16).toUpperCase().padStart(4,"0")}</span></div>` +
    `<div class="row"><span class="k">SAMPLES</span><span>ユニーク ${SAMPLES.filter(s=>s.idx!=="FULL").length} 個 / 重複 ${DUPES.length} 件・極短(${JUNK_FRAME_THRESHOLD}f未満)${JUNK.length}件を除外</span></div>` +
    loopRow;
  $("fileinfo").style.display = "block";
}

function drawWave(canvas, pcm, color){
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth || 90, h = canvas.clientHeight || 26;
  canvas.width = w*dpr; canvas.height = h*dpr;
  const c = canvas.getContext("2d"); c.scale(dpr,dpr);
  c.clearRect(0,0,w,h); c.strokeStyle = color || "#2f2f3a"; c.lineWidth = 1;
  c.beginPath();
  const step = Math.max(1, Math.floor(pcm.length / w));
  for(let x=0;x<w;x++){
    let mn=32767, mx=-32768;
    for(let i=x*step;i<Math.min((x+1)*step,pcm.length);i++){ const v=pcm[i]; if(v<mn)mn=v; if(v>mx)mx=v; }
    if(mn>mx){mn=0;mx=0;}
    c.moveTo(x+.5, h/2 - (mx/32768)*(h/2-1));
    c.lineTo(x+.5, h/2 - (mn/32768)*(h/2-1));
  }
  c.stroke();
}

function renderList(){
  const el = $("slist"); el.innerHTML = "";
  updateCap();
  for(const s of SAMPLES){
    const row = document.createElement("div"); row.className = "srow";
    const dur = (s.frames/RATE).toFixed(2);
    const envBadge = (s.env && s.env.fromDSP)
      ? `<span class="lp" style="background:var(--sfc-yellow)" title="DSPボイス${s.env.voice}のADSR実測: A ${(s.env.attackSec*1000).toFixed(0)}ms / D ${(s.env.decaySec*1000).toFixed(0)}ms / SL ${s.env.sl+1}/8 / S ${isFinite(s.env.sustainSec)?s.env.sustainSec.toFixed(2)+"s":"∞"} → release ${(s.env.releaseSec).toFixed(2)}s">ADSR</span>`
      : "";
    const kindBadge = s.isFullMix
      ? `<span class="lp" style="background:var(--sfc-red)">FULL</span>`
      : s.dspCaptured
        ? `<span class="lp" style="background:var(--sfc-blue)" title="ソロ再生で実際に鳴らした音を切り出したもの">NOTE実測</span>`
        : `<span class="lp ${s.loopFlag?"loop":"shot"}">${s.loopFlag?"LOOP":"SHOT"}</span>`;
    const nameTag = s.idx === "FULL" ? "FULL" : `#${String(s.idx).padStart(2,"0")}`;
    row.innerHTML =
      `<input type="checkbox" ${SELECTED.has(s.idx)?"checked":""} data-i="${s.idx}">` +
      `<span class="nm mono">${nameTag}</span>` +
      kindBadge + envBadge +
      `<canvas></canvas>` +
      `<span class="meta mono">${s.frames}f · ${dur}s</span>` +
      `<button title="試聴" data-p="${s.idx}">▶</button>`;
    el.appendChild(row);
    drawWave(row.querySelector("canvas"), s.pcm);
    row.querySelector("input").addEventListener("change", ev=>{
      const i = ev.target.dataset.i === "FULL" ? "FULL" : +ev.target.dataset.i;
      if(ev.target.checked){
        if(SELECTED.size >= MAXPADS){ ev.target.checked = false; return; }
        SELECTED.add(i);
      } else SELECTED.delete(i);
      updateCap(); renderPads();
    });
    row.querySelector("button").addEventListener("click", ()=> playSample(s));
  }
  for(const d of DUPES){
    const row = document.createElement("div"); row.className = "srow dup mono";
    row.innerHTML = `<span style="width:16px"></span><span class="nm">#${String(d.idx).padStart(2,"0")}</span>` +
      `<span class="meta">#${String(d.dupOf).padStart(2,"0")} と同一内容のため除外</span>`;
    el.appendChild(row);
  }
  for(const j of JUNK){
    const row = document.createElement("div"); row.className = "srow dup mono";
    row.innerHTML = `<span style="width:16px"></span><span class="nm">#${String(j.idx).padStart(2,"0")}</span>` +
      `<span class="meta">${j.frames}f(${JUNK_FRAME_THRESHOLD}f未満)のダミー領域のため除外</span>`;
    el.appendChild(row);
  }
}
function updateCap(){
  $("cap").innerHTML = `パッド割当: <b>${SELECTED.size} / ${MAXPADS}</b>(チェックで入替。16パッド×4バンク)`;
}

const PADCOLORS = ["--sfc-red","--sfc-yellow","--sfc-green","--sfc-blue"];
const BANKNAMES = ["A","B","C","D"];
function renderPads(){
  const grid = $("padgrid"); grid.innerHTML = "";
  $("padtitle").textContent = `Pad Bank ${BANKNAMES[BANK]} — タップで試聴`;
  const sel = SAMPLES.filter(s=>SELECTED.has(s.idx));
  for(let i=0;i<BANKSIZE;i++){
    const padNo = BANK*BANKSIZE + i;      // グローバルパッド番号 0..63
    const pad = document.createElement("div");
    const s = sel[padNo];
    if(s){
      pad.className = "pad";
      const col = getComputedStyle(document.documentElement).getPropertyValue(PADCOLORS[i%4]).trim();
      pad.innerHTML = `<canvas></canvas><span class="tag" style="background:${col}">${padLabel(s)}</span>`;
      drawWave(pad.querySelector("canvas"), s.pcm, "#3a3a46");
      pad.addEventListener("click", ()=> playSample(s, pad));
    } else {
      pad.className = "pad empty";
      pad.innerHTML = `<canvas></canvas><span class="tag">—</span>`;
    }
    grid.appendChild(pad);
  }
}
function syncBankTabs(){
  document.querySelectorAll("#bankseg button").forEach(b=>
    b.classList.toggle("on", +b.dataset.b === BANK));
}
document.querySelectorAll("#bankseg button").forEach(b=>{
  b.addEventListener("click", ()=>{ BANK = +b.dataset.b; syncBankTabs(); renderPads(); });
});
/* リサイズ時に波形を再描画(低解像度の引き伸ばし防止) */
let rszTimer = null;
window.addEventListener("resize", ()=>{
  if(!SAMPLES.length) return;
  clearTimeout(rszTimer);
  rszTimer = setTimeout(()=>{ renderPads(); renderList(); }, 200);
});

/* ===================== 試聴 ===================== */
function playSample(s, padEl){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state === "suspended") audioCtx.resume();
  // ループ音色は最大1秒ぶん繰り返して試聴(DSP実測サンプルは常にワンショットなのでそのまま)
  let pcm = s.pcm;
  if(s.loopFlag && !s.forceOneshot && $("looppad").checked && pcm.length < RATE){
    const reps = Math.ceil(RATE / pcm.length);
    const ext = new Int16Array(pcm.length * reps);
    for(let r=0;r<reps;r++) ext.set(pcm, r*pcm.length);
    pcm = ext;
  }
  const ab = audioCtx.createBuffer(1, pcm.length, RATE);
  const ch = ab.getChannelData(0);
  for(let i=0;i<pcm.length;i++) ch[i] = pcm[i] / 32768;
  const src = audioCtx.createBufferSource();
  src.buffer = ab; src.connect(audioCtx.destination); src.start();
  if(padEl){ padEl.classList.add("playing"); src.onended = ()=> padEl.classList.remove("playing"); }
}

/* ===================== 書き出し ===================== */
function download(blob, name){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

$("dlkoala").addEventListener("click", async ()=>{
  if(!SELECTED.size) return;
  const sel = SAMPLES.filter(s=>SELECTED.has(s.idx));
  const zip = new JSZip();
  const sampler = zip.folder("sampler");
  sel.forEach((s, padNo)=> sampler.file(`${500+padNo}.wav`, encodeWAV(s.pcm, RATE)));
  sampler.file("sampler.json", JSON.stringify(buildSamplerJSON(sel, RATE), null, 1));
  zip.file("mixer.json",    JSON.stringify(MIXER_TPL, null, 1));
  zip.file("fx.json",       JSON.stringify(FX_TPL, null, 1));
  zip.file("song.json",     JSON.stringify(buildSongJSON(baseName), null, 1));
  zip.file("sequence.json", JSON.stringify(buildSequenceJSON(), null, 1));
  const blob = await zip.generateAsync({type:"blob", compression:"STORE"});
  download(blob, baseName + ".koala");
});

$("dlwav").addEventListener("click", async ()=>{
  const zip = new JSZip();
  for(const s of SAMPLES){
    const tag = s.idx==="FULL" ? "fullmix" : (s.dspCaptured ? "note" : (s.loopFlag?"loop":"oneshot"));
    const name = s.idx==="FULL" ? "fullmix" : String(s.idx).padStart(2,"0");
    zip.file(`sample_${name}_${tag}.wav`, encodeWAV(s.pcm, RATE));
  }
  const blob = await zip.generateAsync({type:"blob", compression:"STORE"});
  download(blob, baseName + "_samples.zip");
});
